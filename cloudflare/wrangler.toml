name = "lal-construction-pdf-manager"
main = "src/index.js"
compatibility_date = "2026-11-07"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "lal-construction-pdf-manager"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PDF_BUCKET"
bucket_name = "lal-construction-pdf-manager"

[vars]
CORS_ORIGINS = "https://lal-construction-mep.vercel.app"
SUPERADMIN_EMAIL = "lal-construction@gmail.com"
